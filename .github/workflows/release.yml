name: Release

# Wydanie powstaje po wypchnieciu tagu vX.Y.Z. Plik jest budowany od nowa i musi byc bajt w bajt
# taki sam jak dist/DIAG8080.COM zatwierdzony w repozytorium.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reference tables match the model
        run: python3 tools/model.py --check src/generated.inc

      - name: Assemble (z88dk)
        run: |
          mkdir -p build
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src z88dk/z88dk \
            z88dk-z80asm -m8080 -b -Isrc -obuild/DIAG8080.bin src/diag8080.asm

      - name: Build matches dist/
        run: |
          cmp build/DIAG8080.bin dist/DIAG8080.COM
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/DIAG8080.COM dist/SHA256SUMS .
          {
            cat .github/release-notes.md
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" DIAG8080.COM SHA256SUMS \
            --title "DIAG8080 $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
